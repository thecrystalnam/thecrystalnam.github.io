# Site settings
# This file is NOT reloaded automatically by `bundle exec jekyll serve`; restart the server after editing.

title: Sujung Nam
# Email is shown as written-out text (no mailto link, no "@") to make it harder for spam bots to pick up.
email_display: "thecrystalnam [at] gmail [dot] com"
description: >-
  Personal website of Sujung Nam, Ph.D. candidate in Korean Linguistics at the
  University of Hawaiʻi at Mānoa, studying conversation analysis and human-AI interaction.
baseurl: ""
url: "https://sujungnam.com"
github_username: thecrystalnam
linkedin_url: "https://www.linkedin.com/in/sujung-nam-5b1529b4"
last_updated: "November 2026"

# Top navigation (in order)
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Projects
    url: /projects/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /assets/Sujung_Nam_CV.pdf
  - title: Contact
    url: /contact/

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

# Image shown when a link to the site is shared (LinkedIn, Slack, iMessage, etc.)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/profile2.png

# Use the small square preview card (the photo is only 200px wide)
twitter:
  card: summary
